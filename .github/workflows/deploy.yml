name: Deploy Vue JS to Production

on:
  push:
    branches:
      - main # Workflow akan berjalan otomatis saat ada push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Sesuaikan dengan versi Node.js yang Anda gunakan

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Copy files via SSH to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*" # Sesuaikan jika folder build Anda bernama lain (misal: build/*)
          target: ${{ secrets.TARGET_DIR }}
          strip_components: 1 # Mengabaikan folder 'dist' agar isinya langsung diekstrak ke target folder
